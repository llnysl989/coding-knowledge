services:
  app:
    build: .
    container_name: docker-practice-app
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: docker-practice-db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: practice_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: